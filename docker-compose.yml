version: "3.9"

services:
  backend:
    build: ./backend
    container_name: ramal_backend
    restart: unless-stopped
    environment:
      - JWT_SECRET=gacc-ba-super-secret-2024
    volumes:
      - ramal_data:/data
    networks:
      - ramal_net

  frontend:
    image: nginx:alpine
    container_name: ramal_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./frontend/public:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - ramal_net

volumes:
  ramal_data:

networks:
  ramal_net:
    driver: bridge
